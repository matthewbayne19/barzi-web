<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Discover</title>
<link rel="stylesheet" href="gig.css"><link rel="stylesheet" href="fonts.css">
</head>
<body>
<style>body{margin:0}
.t{display:flex;flex-direction:column;justify-content:space-between}
.n{font-family:'Bricolage Grotesque',sans-serif;font-weight:800;font-size:48px;line-height:0.85;letter-spacing:-2px}
.l{font-family:'Bricolage Grotesque',sans-serif;font-weight:700;font-size:18px;letter-spacing:-0.4px;line-height:1.05}
</style>
<div class="scr pad">
  <h1 class="h1" style="padding: 0 4px">Discover</h1>
  <div class="field" style="margin-top: 14px; background: #24272E; border: 0; height: 48px"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>Search bars, nights, features</div>
  <div style="margin-top: 12px; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); grid-auto-rows: 100px; gap: 10px">
    <div class="k t" style="grid-row: span 2; background: #8FC4A0; color: #0E1A12"><div class="l">On right now</div><div><div class="n" style="font-size: 88px; letter-spacing: -4px">7</div><div style="font-size: 14px; font-weight: 600">bars, walkable</div></div></div>
    <div class="k k-hh t"><div class="l">Happy hours</div><div class="n">12</div></div>
    <div class="k k-trivia t"><div class="l">Trivia</div><div class="n">3</div></div>
    <div class="k k-karaoke t"><div class="l">Karaoke</div><div class="n">2</div></div>
    <div class="k k-music t"><div class="l">Live music</div><div class="n">4</div></div>
    <div class="k k-sports t"><div class="l">Watch the game</div><div class="n">18</div></div>
    <div class="k t" style="background: #1A1C21"><div class="l">Pool &amp; darts</div><div class="n" style="color: #C9CBD1">14</div></div>
  </div>
  <div style="margin-top: 14px; display: flex; justify-content: space-between; align-items: center; padding: 0 4px">
    <div class="h3">Your bars</div><span class="sub">See all</span>
  </div>
  <div style="margin-top: 10px; display: flex; gap: 8px">
    <span class="chip">Moran's</span><span class="chip">Ale House</span><span class="chip">Mulligan's</span>
  </div>

  <nav class="tabbar">
    <button type="button" class="tab"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/></svg>Tonight</button>
    <button type="button" class="tab on"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M15.5 8.5l-2 5-5 2 2-5z"/></svg>Discover</button>
    <button type="button" class="tab"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 4L3 6v14l6-2 6 2 6-2V4l-6 2z"/><path d="M9 4v14M15 6v14"/></svg>Map</button>
    <button type="button" class="tab"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"/></svg>Profile</button>
  </nav>
</div>
</body>
</html>
