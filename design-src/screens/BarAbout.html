<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Bar page About</title>
<link rel="stylesheet" href="gig.css"><link rel="stylesheet" href="fonts.css">
</head>
<body>
<style>body{margin:0}
.am{height:76px;border-radius:14px;background:#1A1C21;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;font-size:12px;font-weight:600;color:#C9CBD1}
</style>
<div class="scr pad">
  <div style="display: flex; align-items: center; gap: 12px">
    <button type="button" class="round" aria-label="Back"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M15 6l-6 6 6 6"/></svg></button>
    <h1 class="h2" style="flex-grow: 1">Willie McBride's</h1>
  </div>
  <div class="bq" style="margin-top: 18px; display: flex; gap: 20px; font-weight: 700; font-size: 18px; color: #5C5F68">
    <span>Tonight</span><span>This week</span><span style="color: #F2F2F0; border-bottom: 3px solid #F2F2F0; padding-bottom: 4px">About</span>
  </div>
  <div class="over" style="margin-top: 20px">What's here</div>
  <div style="margin-top: 10px; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px">
    <div class="am"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="12" rx="2"/><path d="M8 21h8"/></svg>TVs</div>
    <div class="am"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><path d="M12 12h.01"/></svg>Darts</div>
    <div class="am"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="3"/></svg>Pool</div>
    <div class="am"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2"/></svg>Patio</div>
  </div>
  <div class="over" style="margin-top: 20px">Hours</div>
  <div style="margin-top: 6px">
    <div class="row" style="min-height: 44px"><span class="bq" style="width: 60px; font-weight: 800">Today</span><span style="flex-grow: 1">11 AM – 2 AM</span><span class="now"><i></i>OPEN</span></div>
    <div class="row" style="min-height: 44px; color: #A9ABB2"><span style="width: 60px">Fri–Sat</span><span>11 AM – 3 AM</span></div>
    <div class="row rowlast" style="min-height: 44px; color: #A9ABB2"><span style="width: 60px">Sun</span><span>10 AM – 1 AM</span></div>
  </div>
  <div class="over" style="margin-top: 16px">Good to know</div>
  <div style="margin-top: 8px; display: flex; flex-wrap: wrap; gap: 6px"><span class="chip">$$</span><span class="chip">Cards ok</span><span class="chip">Kitchen till 12</span></div>
  <div style="margin-top: 16px; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px">
    <button type="button" class="btn2" style="height: 48px; font-size: 14px">Call</button><button type="button" class="btn2" style="height: 48px; font-size: 14px">Website</button><button type="button" class="btn2" style="height: 48px; font-size: 14px">Instagram</button>
  </div>
  <div class="sub" style="margin-top: 14px">616 Grand St · <span style="text-decoration: underline">Suggest an edit</span></div>
</div>
</body>
</html>
