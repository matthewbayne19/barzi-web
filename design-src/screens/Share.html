<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Share card</title>
<link rel="stylesheet" href="gig.css"><link rel="stylesheet" href="fonts.css">
</head>
<body>
<style>body{margin:0}</style>
<div class="scr" style="padding: 40px 30px 0; background: #08090B">
  <div class="over" style="text-align: center">Share image · 9:16</div>
  <div style="margin-top: 14px; height: 590px; border-radius: 26px; overflow: hidden; background: #101114; display: flex; flex-direction: column; box-shadow: 0 30px 60px rgba(0,0,0,0.6)">
    <div class="k k-trivia" style="height: 380px; border-radius: 0; padding: 22px; display: flex; flex-direction: column; justify-content: space-between">
      <div class="ghost" style="left: -12px; top: 92px; font-size: 128px; letter-spacing: -7px; color: #5E5EE0">TRIVIA</div>
      <div class="bq" style="position: relative; font-weight: 800; font-size: 22px; letter-spacing: -0.8px">barzi</div>
      <div style="position: relative">
        <div style="display: inline-flex; height: 34px; padding: 0 12px; border-radius: 10px; background: #101114; color: #E5A06F; align-items: center; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 18px">Tonight · 8 PM</div>
        <div class="h1" style="margin-top: 10px; font-size: 46px">Trivia night</div>
        <div class="ink" style="margin-top: 6px; font-size: 16px; font-weight: 600">Willie McBride's</div>
      </div>
    </div>
    <div style="flex-grow: 1; padding: 18px 22px; display: flex; flex-direction: column; justify-content: space-between">
      <div style="display: flex; flex-direction: column; gap: 8px">
        <div style="display: flex; gap: 10px; align-items: center"><span style="width: 10px; height: 10px; border-radius: 5px; background: #B33A80"></span><span style="font-weight: 600">9:00 Karaoke</span><span class="sub">Mulligan's</span></div>
        <div style="display: flex; gap: 10px; align-items: center"><span style="width: 10px; height: 10px; border-radius: 5px; background: #2A6FA8"></span><span style="font-weight: 600">9:30 Live music</span><span class="sub">Ale House</span></div>
      </div>
      <div class="bq" style="font-weight: 700; font-size: 15px; color: #A9ABB2">what's up tonight · gobarzi.com</div>
    </div>
  </div>
  <div style="margin-top: 22px; display: flex; justify-content: center; gap: 22px">
    <button type="button" class="round" aria-label="Messages"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5h16v11H8l-4 4z"/></svg></button>
    <button type="button" class="round" aria-label="Instagram story"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="4" width="16" height="16" rx="5"/><circle cx="12" cy="12" r="3.5"/></svg></button>
    <button type="button" class="round" aria-label="Save image"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4v11M7 10l5 5 5-5M5 20h14"/></svg></button>
    <button type="button" class="round" aria-label="More"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h.01M12 12h.01M19 12h.01"/></svg></button>
  </div>
</div>
</body>
</html>
