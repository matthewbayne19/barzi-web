<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Profile member card</title>
<link rel="stylesheet" href="gig.css"><link rel="stylesheet" href="fonts.css">
</head>
<body>
<style>body{margin:0}
.pr{font-family:'Bricolage Grotesque',sans-serif;font-weight:700;font-size:20px;letter-spacing:-0.4px;justify-content:space-between}
</style>
<div class="scr pad">
  <div style="height: 300px; border-radius: 24px; background: #FF6B4A; color: #1A0A05; position: relative; overflow: hidden; padding: 18px; box-sizing: border-box">
    <div class="ghost" style="right: -14px; bottom: -48px; font-size: 210px; letter-spacing: -12px; color: #F05C3B">027</div>
    <div style="position: relative; display: flex; justify-content: space-between; align-items: center">
      <div class="bq" style="font-weight: 800; font-size: 30px; letter-spacing: -1px">barzi</div>
      <div style="height: 28px; padding: 0 10px; border-radius: 8px; background: #1A0A05; color: #FFC2B3; font-size: 12px; font-weight: 700; letter-spacing: 1px; display: flex; align-items: center">FOUNDING</div>
    </div>
    <div style="position: relative; margin-top: 54px">
      <div style="font-size: 13px; font-weight: 700; letter-spacing: 1.4px">MEMBER NO.</div>
      <div class="big" style="font-size: 76px; letter-spacing: -4px; line-height: 0.85">027</div>
      <div style="margin-top: 12px; font-size: 17px; font-weight: 700">Alex · since Nov 2026</div>
    </div>
  </div>
  <div style="margin-top: 18px; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; padding: 0 4px">
    <div><div class="big" style="font-size: 44px; letter-spacing: -2px">14</div><div class="sub" style="margin-top: 4px">nights</div></div>
    <div><div class="big" style="font-size: 44px; letter-spacing: -2px">9</div><div class="sub" style="margin-top: 4px">bars</div></div>
    <div><div class="big" style="font-size: 44px; letter-spacing: -2px">6</div><div class="sub" style="margin-top: 4px">saved</div></div>
  </div>
  <div style="margin-top: 12px; padding: 0 4px">
    <div class="row pr">Your nights<svg class="ic" style="color: #5C5F68" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg></div>
    <div class="row pr">Saved bars<svg class="ic" style="color: #5C5F68" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg></div>
    <div class="row pr">Suggest an edit<svg class="ic" style="color: #5C5F68" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg></div>
    <div class="row pr rowlast" style="color: #A9ABB2">Settings<svg class="ic" style="color: #5C5F68" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg></div>
  </div>
  <nav class="tabbar">
    <button type="button" class="tab"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/></svg>Tonight</button>
    <button type="button" class="tab"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M15.5 8.5l-2 5-5 2 2-5z"/></svg>Discover</button>
    <button type="button" class="tab"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 4L3 6v14l6-2 6 2 6-2V4l-6 2z"/><path d="M9 4v14M15 6v14"/></svg>Map</button>
    <button type="button" class="tab on"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"/></svg>Profile</button>
  </nav>
</div>
</body>
</html>
