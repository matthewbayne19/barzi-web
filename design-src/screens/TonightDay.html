<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Tonight another day</title>
<link rel="stylesheet" href="gig.css"><link rel="stylesheet" href="fonts.css">
</head>
<body>
<style>body{margin:0}</style>
<div class="scr pad">
  <div style="display: flex; justify-content: space-between; align-items: flex-end; padding: 0 4px">
    <h1 class="h1">Friday</h1>
    <button type="button" class="sq" aria-label="Filter"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg></button>
  </div>
  <div class="bq" style="margin-top: 14px; padding: 0 4px; display: flex; gap: 16px; align-items: baseline; font-weight: 700; font-size: 18px; color: #5C5F68">
    <span>Tonight</span><span>Wed</span><span>Thu</span><span style="color: #F2F2F0; font-size: 22px; border-bottom: 3px solid #F2F2F0; padding-bottom: 2px">Fri</span><span>Sat</span><span>Sun</span>
  </div>
  <div class="sub" style="margin-top: 14px; padding: 0 4px">Nov 14 · 11 things on</div>

  <div style="margin-top: 14px; display: flex; flex-direction: column; gap: 10px">
      <div style="display: flex; gap: 12px; align-items: center">
        <div class="blk k-hh"><b>4</b><span>PM</span></div>
        <div style="flex-grow: 1; min-width: 0"><div class="h3">Happy hour</div><div class="sub">Moran's · till 7</div></div>
        <svg class="ic" style="color: #5C5F68" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg>
      </div>
      <div style="display: flex; gap: 12px; align-items: center">
        <div class="blk k-hh"><b>5</b><span>PM</span></div>
        <div style="flex-grow: 1; min-width: 0"><div class="h3">Happy hour</div><div class="sub">Ale House · till 7</div></div>
        <svg class="ic" style="color: #5C5F68" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg>
      </div>
      <div style="display: flex; gap: 12px; align-items: center">
        <div class="blk k-sports"><b>7</b><span>PM</span></div>
        <div style="flex-grow: 1; min-width: 0"><div class="h3">Devils game</div><div class="sub">Willie McBride's</div></div>
        <svg class="ic" style="color: #5C5F68" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg>
      </div>
      <div style="display: flex; gap: 12px; align-items: center">
        <div class="blk k-music"><b>9</b><span>PM</span></div>
        <div style="flex-grow: 1; min-width: 0"><div class="h3">Live music</div><div class="sub">Ale House</div></div>
        <svg class="ic" style="color: #5C5F68" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg>
      </div>
      <div style="display: flex; gap: 12px; align-items: center">
        <div class="blk k-karaoke"><b>10</b><span>PM</span></div>
        <div style="flex-grow: 1; min-width: 0"><div class="h3">Karaoke</div><div class="sub">Mulligan's</div></div>
        <svg class="ic" style="color: #5C5F68" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg>
      </div>
      <div style="display: flex; gap: 12px; align-items: center">
        <div class="blk k-other"><b>11</b><span>PM</span></div>
        <div style="flex-grow: 1; min-width: 0"><div class="h3">DJ night</div><div class="sub">McSwiggan's</div></div>
        <svg class="ic" style="color: #5C5F68" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg>
      </div>
  </div>

  <nav class="tabbar">
    <button type="button" class="tab on"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/></svg>Tonight</button>
    <button type="button" class="tab"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M15.5 8.5l-2 5-5 2 2-5z"/></svg>Discover</button>
    <button type="button" class="tab"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 4L3 6v14l6-2 6 2 6-2V4l-6 2z"/><path d="M9 4v14M15 6v14"/></svg>Map</button>
    <button type="button" class="tab"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"/></svg>Profile</button>
  </nav>
</div>
</body>
</html>
